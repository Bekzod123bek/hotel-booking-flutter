<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Hotel Booking">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C76A6"/>
      <stop offset="1" stop-color="#1D5FC4"/>
    </linearGradient>
    <mask id="cut">
      <rect width="512" height="512" fill="black"/>
      <!-- Pin: circle + tip -->
      <circle cx="256" cy="230" r="150" fill="white"/>
      <polygon points="160,338 352,338 256,462" fill="white"/>
      <!-- Facade punched out of the pin -->
      <polygon points="146,166 256,132 366,166" fill="black"/>
      <rect x="160" y="166" width="192" height="156" rx="10" fill="black"/>
      <!-- Windows and door -->
      <g fill="white">
        <rect x="178" y="186" width="22" height="22" rx="4"/>
        <rect x="220" y="186" width="22" height="22" rx="4"/>
        <rect x="262" y="186" width="22" height="22" rx="4"/>
        <rect x="178" y="228" width="22" height="22" rx="4"/>
        <rect x="220" y="228" width="22" height="22" rx="4"/>
        <rect x="262" y="228" width="22" height="22" rx="4"/>
        <rect x="239" y="270" width="34" height="44" rx="6"/>
      </g>
    </mask>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#brand)"/>
  <rect width="512" height="512" fill="#FFFFFF" mask="url(#cut)"/>
</svg>
